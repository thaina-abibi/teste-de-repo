<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC DETRAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#23272D;
    --bg-card:#2F353D;
    --bg-card-hi:#3A414A;
    --line:#454E58;
    --teal-deep:#0F4C5C;
    --teal:#1B6B7A;
    --mint:#8BC4B9;
    --amber:#F2C14E;
    --amber-hi:#F7D77A;
    --amber-dim:#B08A2F;
    --cream:#FFF4D6;
    --offwhite:#F2F7F6;
    --slate:#8C97A1;
    --bluegray:#9AA5B1;
    --danger:#C1666B;
    --danger-hi:#D98488;
    --plum:#6B2A63;
    --plum-line:#8E3D84;
    --plum-text:#F4CFEE;
    --tele:#7FB6CE;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg-primary);
    color:var(--offwhite);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  #bg-layer{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(1100px 700px at 82% 8%, rgba(27,107,122,0.55), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(15,76,92,0.6), transparent 55%),
      var(--bg-primary);
  }
  #bg-lines{position:fixed; inset:0; z-index:0; opacity:0.16; pointer-events:none;}
  #app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

  .center-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
  .brand{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:6px;}
  .brand-mark{width:46px; height:46px; flex-shrink:0; border-radius:12px; object-fit:cover;}
  .brand-text{text-align:left;}
  .brand-title{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:0.5px; color:var(--cream); line-height:1;}
  .brand-sub{font-family:var(--font-mono); font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--mint); margin-top:4px;}

  .card{
    width:100%; max-width:420px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:34px 32px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--teal-deep), var(--amber), var(--mint));
  }

  .route-svg{display:block; margin:18px auto 22px; width:100%; max-width:220px; height:14px;}
  .route-svg path{
    fill:none; stroke:var(--amber); stroke-width:2; stroke-linecap:round;
    stroke-dasharray:260; stroke-dashoffset:260;
    animation:drawroute 1.4s ease forwards 0.2s;
  }
  @keyframes drawroute{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .route-svg path{animation:none; stroke-dashoffset:0;}
  }

  .field{margin-bottom:16px;}
  .field label{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--bluegray); margin-bottom:7px;}
  .input-row{position:relative;}
  input[type="text"], input[type="password"], input[type="email"], input[type="date"], input[type="time"], select, textarea{
    width:100%; padding:12px 14px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg-primary); color:var(--offwhite);
    font-family:var(--font-body); font-size:14.5px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical; min-height:96px; line-height:1.5;}
  input:focus, select:focus, textarea:focus{
    border-color:var(--amber); box-shadow:0 0 0 3px rgba(242,193,78,0.18);
  }
  input[readonly]{color:var(--mint); background:var(--bg-card-hi); cursor:not-allowed;}
  select{
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239AA5B1' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;
  }
  .toggle-eye{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:6px; color:var(--slate);
    display:flex; align-items:center;
  }
  .toggle-eye:hover{color:var(--mint);}
  .toggle-eye:focus-visible, button:focus-visible, .link-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }

  .btn{
    width:100%; padding:12px 16px; border-radius:8px; border:none; cursor:pointer;
    font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:0.4px;
    transition:transform .1s, filter .15s; margin-top:4px;
  }
  .btn:active{transform:scale(0.985);}
  .btn-primary{background:var(--amber); color:#2A2106;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.5; cursor:not-allowed; filter:none;}
  .btn-secondary{background:transparent; border:1px solid var(--line); color:var(--offwhite);}
  .btn-secondary:hover{border-color:var(--mint); color:var(--mint);}
  .btn-danger-outline{background:transparent; border:1px solid var(--danger); color:var(--danger-hi);}
  .btn-danger-outline:hover{background:rgba(193,102,107,0.12);}
  .btn-ghost-teal{background:rgba(139,196,185,0.12); border:1px solid rgba(139,196,185,0.35); color:var(--mint);}
  .btn-ghost-teal:hover{background:rgba(139,196,185,0.2);}
  .btn-sm{width:auto; padding:7px 12px; font-size:12.5px;}

  .link-btn{
    background:none; border:none; color:var(--mint); font-family:var(--font-body);
    font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4px;
  }
  .link-btn:hover{color:var(--amber-hi);}
  .center-link{display:flex; justify-content:center; margin-top:18px;}

  .error-box{
    background:rgba(193,102,107,0.14); border:1px solid rgba(193,102,107,0.4);
    color:var(--danger-hi); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px;
  }
  .success-box{
    background:rgba(139,196,185,0.14); border:1px solid rgba(139,196,185,0.4);
    color:var(--mint); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,21,0.72); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-card{max-width:480px; padding:28px 26px 24px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 26px;
    border-bottom:1px solid var(--line); background:rgba(47,53,61,0.7); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:10;
  }
  .topbar .brand{margin-bottom:0;}
  .topbar .brand-mark{width:32px; height:32px;}
  .topbar .brand-title{font-size:18px;}
  .topbar .brand-sub{font-size:9px;}
  .logout-x{
    background:none; border:1px solid var(--line); color:var(--bluegray); border-radius:7px;
    padding:8px 14px; font-family:var(--font-body); font-size:12.5px; cursor:pointer;
  }
  .logout-x:hover{border-color:var(--danger); color:var(--danger-hi);}

  .dash-wrap{max-width:920px; margin:0 auto; padding:30px 22px 60px; width:100%;}
  .section-title{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--cream); letter-spacing:0.3px; margin:0 0 4px;}
  .section-sub{color:var(--bluegray); font-size:13px; margin:0 0 18px;}
  .panel{background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:26px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){ .grid-2, .grid-3{grid-template-columns:1fr;} }

  .credential-result{
    background:var(--bg-primary); border:1px dashed var(--amber-dim); border-radius:10px;
    padding:16px 18px; margin-top:16px;
  }
  .cred-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:12px;}
  .cred-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--bluegray);}
  .cred-value{font-family:var(--font-mono); font-size:15px; color:var(--amber-hi); font-weight:600;}
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--slate); border-radius:6px;
    padding:4px 9px; font-size:11px; cursor:pointer; font-family:var(--font-mono);
  }
  .copy-btn:hover{color:var(--mint); border-color:var(--mint);}

  table{width:100%; border-collapse:collapse; margin-top:6px;}
  thead th{
    text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; color:var(--bluegray); padding:10px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:12px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .user-cpf{font-family:var(--font-mono); color:var(--bluegray); font-size:12.5px;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px;
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px;
  }
  .badge-active{background:rgba(139,196,185,0.15); color:var(--mint); border:1px solid rgba(139,196,185,0.35);}
  .badge-inactive{background:rgba(193,102,107,0.15); color:var(--danger-hi); border:1px solid rgba(193,102,107,0.35);}
  .badge-temp{background:rgba(242,193,78,0.15); color:var(--amber-hi); border:1px solid rgba(242,193,78,0.35); margin-left:6px;}
  .empty-state{text-align:center; color:var(--bluegray); padding:40px 10px; font-size:13.5px;}

  .nav-tabs{display:flex; gap:8px; padding:14px 22px; max-width:1040px; margin:0 auto; flex-wrap:wrap;}
  .nav-tab{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--offwhite);
    font-family:var(--font-body); font-size:13.5px; font-weight:500; cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .nav-tab svg{width:17px; height:17px; flex-shrink:0;}
  .nav-tab:hover{border-color:var(--mint); color:var(--mint);}
  .nav-tab.active{background:rgba(242,193,78,0.14); border-color:var(--amber); color:var(--amber-hi);}

  .content-wrap{max-width:1040px; margin:0 auto; padding:6px 22px 60px; width:100%;}
  .screen{display:none;}
  .screen.active{display:block;}
  .content-wrap .btn{width:auto; margin-top:0;}
  .content-wrap .field label{font-size:10.5px; letter-spacing:1.1px;}
  .content-wrap input, .content-wrap select, .content-wrap textarea{padding:11px 13px; font-size:14px;}

  .celula-group{margin-bottom:34px;}
  .celula-heading{
    display:flex; align-items:baseline; gap:10px; font-family:var(--font-display); font-weight:700;
    font-size:19px; color:var(--amber-hi); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;
  }
  .celula-heading .count{
    font-family:var(--font-mono); font-size:11px; color:var(--bluegray); background:rgba(35,39,45,0.6);
    border:1px solid var(--line); border-radius:100px; padding:2px 9px; text-transform:none; letter-spacing:0;
  }
  .celula-rule{height:1px; background:linear-gradient(90deg, var(--amber-dim), transparent); margin-bottom:56px;}

  .colab-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(252px,1fr)); gap:62px 18px;}
  .colab-card{
    position:relative; margin-top:0; padding:54px 16px 14px; border-radius:16px;
    background:linear-gradient(180deg, rgba(58,65,74,0.92), rgba(47,53,61,0.92));
    border:1px solid var(--line);
    box-shadow:0 14px 34px rgba(0,0,0,0.32);
  }
  .colab-avatar, .colab-avatar-ph{
    position:absolute; top:-44px; left:50%; transform:translateX(-50%);
    width:100px; height:100px; border-radius:50%; object-fit:cover;
    border:3px solid var(--amber); background:var(--bg-primary);
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
  }
  .colab-avatar-ph{
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--amber-dim);
  }
  .card-icon{
    position:absolute; top:10px; background:none; border:none; cursor:pointer;
    color:var(--amber-dim); padding:4px; line-height:0; border-radius:6px; transition:color .15s, background .15s;
  }
  .card-icon:hover{color:var(--amber-hi); background:rgba(242,193,78,0.12);}
  .card-icon svg{width:18px; height:18px;}
  .card-icon-add{left:10px;}
  .card-icon-add.has-notes{color:var(--amber);}
  .card-icon-copy{right:10px;}
  .colab-nome{
    text-align:center; font-size:16.5px; font-weight:700; color:var(--offwhite);
    line-height:1.25; margin-bottom:12px; overflow-wrap:anywhere;
  }
  .colab-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:22px;}
  .colab-cargo{font-size:12px; color:var(--bluegray); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .colab-flags{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .flag-icon{line-height:0;}
  .flag-icon svg{width:19px; height:19px;}
  .flag-swat{color:var(--mint);}
  .flag-tele{color:var(--tele);}
  .flag-ferias{
    background:var(--plum); border:1px solid var(--plum-line); color:var(--plum-text);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.4px;
    padding:4px 9px; border-radius:7px; white-space:nowrap;
  }

  .photo-upload{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  .photo-preview{
    width:72px; height:72px; border-radius:50%; object-fit:cover; background:var(--bg-primary);
    border:1px solid var(--line); flex-shrink:0;
  }
  .photo-preview-placeholder{
    width:72px; height:72px; border-radius:50%; background:var(--bg-primary); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--slate); flex-shrink:0;
  }

  .divider-note{
    display:flex; align-items:center; gap:10px; margin:26px 0 14px; color:var(--slate); font-size:10.5px;
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1.2px;
  }
  .divider-note::before, .divider-note::after{content:""; flex:1; height:1px; background:var(--line);}

  .ferias-row{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  .remove-ferias{
    background:none; border:1px solid var(--danger); color:var(--danger-hi); border-radius:8px;
    padding:11px 12px; cursor:pointer; font-size:12px; height:41px;
  }
  .remove-ferias:hover{background:rgba(193,102,107,0.12);}
  .inline-btn{
    background:rgba(139,196,185,0.12); border:1px solid rgba(139,196,185,0.35); color:var(--mint);
    font-family:var(--font-body); font-weight:600; font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer;
  }
  .inline-btn:hover{background:rgba(139,196,185,0.2);}
  .inline-btn-danger{
    background:transparent; border:1px solid var(--danger); color:var(--danger-hi);
    font-family:var(--font-body); font-weight:600; font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer;
  }
  .inline-btn-danger:hover{background:rgba(193,102,107,0.12);}
  .form-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; align-items:center;}

  .log-list{list-style:none; margin:0; padding:0; max-height:260px; overflow-y:auto;}
  .log-item{
    background:var(--bg-primary); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; margin-bottom:9px;
  }
  .log-meta{
    font-family:var(--font-mono); font-size:10px; color:var(--slate);
    letter-spacing:0.5px; margin-bottom:5px;
  }
  .log-meta strong{color:var(--mint); font-weight:600;}
  .log-text{font-size:13px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;}
  .log-empty{font-size:12.5px; color:var(--slate); padding:4px 0 10px;}

  .hint{font-size:11.5px; color:var(--slate); margin-top:6px;}

  .loading-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--bluegray); font-family:var(--font-mono); font-size:13px;}
  .spinner{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--line);
    border-top-color:var(--amber); animation:spin 0.8s linear infinite; margin-right:10px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--bg-card-hi); border:1px solid var(--line); color:var(--offwhite);
    padding:12px 20px; border-radius:9px; font-size:13.5px; z-index:100;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); animation:toastin .2s ease;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
</style>
</head>
<body>
<div id="bg-layer"></div>
<svg id="bg-lines" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g stroke="var(--mint)" stroke-width="1" fill="none">
    <path d="M -50 700 L 300 350 L 600 500 L 950 100 L 1300 250"/>
    <path d="M -50 500 L 250 600 L 500 300 L 800 450 L 1250 50"/>
    <path d="M -100 150 L 350 250 L 700 50 L 1000 300 L 1300 150"/>
    <circle cx="880" cy="120" r="60"/>
    <circle cx="880" cy="120" r="110"/>
    <circle cx="200" cy="620" r="50"/>
  </g>
</svg>

<div id="app"><div class="loading-wrap"><span class="spinner"></span>Carregando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    databaseURL: "https://sac-detran-default-rtdb.firebaseio.com/"
  };

  var db = null;
  if(typeof firebase !== "undefined" && firebaseConfig.databaseURL.indexOf("SEU-PROJETO") === -1){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }

  var ADMIN_CODE = "SACDETRAN";
  var ADMIN_PASS = "ADMINSAC";

  function genPassword(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var out = "";
    for(var i=0;i<8;i++){ out += chars[Math.floor(Math.random()*chars.length)]; }
    return out;
  }

  function genId(){ return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }

  function onlyDigits(v){ return (v||"").replace(/\D/g,""); }

  function formatCPF(v){
    var d = onlyDigits(v).slice(0,11);
    var out = d;
    if(d.length > 9) out = d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
    else if(d.length > 6) out = d.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
    else if(d.length > 3) out = d.replace(/(\d{3})(\d{1,3})/, "$1.$2");
    return out;
  }

  function formatTelefone(v){
    var d = onlyDigits(v).slice(0,11); var out = d;
    if(d.length > 10) out = d.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
    else if(d.length > 6) out = d.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
    else if(d.length > 2) out = d.replace(/(\d{2})(\d{0,5})/, "($1) $2");
    return out;
  }

  function hojeISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function formatData(iso){
    if(!iso) return "";
    var p = String(iso).slice(0,10).split("-");
    if(p.length !== 3) return iso;
    return p[2] + "/" + p[1] + "/" + p[0];
  }

  function formatDataHora(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  }

  function initials(nome){
    var parts = (nome||"").trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
  }

  function emFerias(colab){
    var hoje = hojeISO();
    return (colab.ferias || []).some(function(f){
      if(!f) return false;
      var ini = f.inicio || "";
      var fim = f.fim || "";
      if(ini && fim) return hoje >= ini && hoje <= fim;
      if(ini) return hoje === ini;
      if(fim) return hoje === fim;
      return false;
    });
  }

  function resizeImage(file, maxSide, cb){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(canvas.toDataURL("image/jpeg", 0.82)); }
        catch(e){ cb(ev.target.result); }
      };
      img.onerror = function(){ cb(ev.target.result); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function toArray(val){
    if(!val) return [];
    return Array.isArray(val) ? val.filter(Boolean) : Object.keys(val).map(function(k){ return val[k]; });
  }

  function syncUsers(){
    if(db){
      db.ref("users").on("value", function(snapshot){
        state.users = toArray(snapshot.val());
        state.booted = true;
        if(state.screen === "painel") return;
        render();
      });
    } else {
      try {
        var data = localStorage.getItem(LS_USERS);
        state.users = data ? JSON.parse(data) : [];
      } catch(e){ state.users = []; }
      state.booted = true;
      render();
    }
  }

  async function saveUsers(){
    if(db){
      try { await db.ref("users").set(state.users); return true; }
      catch(e){ showToast("Não foi possível salvar no servidor."); return false; }
    }
    localStorage.setItem(LS_USERS, JSON.stringify(state.users));
    return true;
  }

      });
    } else {
      try {
        var raw = localStorage.getItem(LS_COLAB);
        state.colaboradores = raw ? JSON.parse(raw) : [];

  function attachHandlers(){
    var loginForm = document.getElementById("login-form");
    if(loginForm) loginForm.addEventListener("submit", handleLogin);

    var toggleLoginPass = document.getElementById("toggle-login-pass");
    if(toggleLoginPass) toggleLoginPass.addEventListener("click", function(){
      togglePassVisibility("login-pass", toggleLoginPass);
    });

    var openGate = document.getElementById("open-admin-gate");
    if(openGate) openGate.addEventListener("click", function(){
      state.screen = "adminGate"; state.error = ""; render();
    });

    var adminGateForm = document.getElementById("admin-gate-form");
    if(adminGateForm) adminGateForm.addEventListener("submit", handleAdminGate);

    var toggleAdminPass = document.getElementById("toggle-admin-pass");
    if(toggleAdminPass) toggleAdminPass.addEventListener("click", function(){
      togglePassVisibility("admin-pass", toggleAdminPass);
    });

    var cancelGate = document.getElementById("cancel-admin-gate");
    if(cancelGate) cancelGate.addEventListener("click", function(){
      state.screen = "login"; state.error = ""; render();
    });

    var createUserForm = document.getElementById("create-user-form");
    if(createUserForm){
      createUserForm.addEventListener("submit", handleCreateUser);
      var cpfInput = document.getElementById("new-cpf");
      if(cpfInput) cpfInput.addEventListener("input", function(e){ e.target.value = formatCPF(e.target.value); });
    }

    var copyCred = document.getElementById("copy-cred");
    if(copyCred) copyCred.addEventListener("click", handleCopyCred);

    var changePassForm = document.getElementById("change-pass-form");
    if(changePassForm) changePassForm.addEventListener("submit", handleChangePass);

    var logoutBtn = document.getElementById("logout-btn");
    if(logoutBtn) logoutBtn.addEventListener("click", handleLogout);

    document.querySelectorAll("[data-action]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var act = btn.getAttribute("data-action");
        var u = btn.getAttribute("data-username");
        if(act === "reset") handleResetUserPass(u);
        else if(act === "toggle") handleToggleUserStatus(u);
      });
    });
  }

  function togglePassVisibility(inputId, btn){
    var inp = document.getElementById(inputId);
    if(!inp) return;
    var show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.innerHTML = eyeSVG(show);
  }

  function handleLogin(e){
    e.preventDefault();
    state.error = "";
    var uVal = (document.getElementById("login-user").value||"").trim();
    var pVal = document.getElementById("login-pass").value||"";

    if(!uVal || !pVal){ state.error = "Preencha usuário e senha."; render(); return; }

    var user = findUser(uVal);
    if(!user || user.password !== pVal){ state.error = "Usuário ou senha inválidos."; render(); return; }
    if(!user.active){ state.error = "Usuário inativo. Fale com a administração."; render(); return; }

    state.currentUser = user;
    state.isAdmin = false;
    state.activeTab = "inicio";
    state.screen = user.tempPassword ? "changePassword" : "painel";
    render();
  }

  function handleAdminGate(e){
    e.preventDefault();
    var code = (document.getElementById("admin-code").value||"").trim();
    var pass = document.getElementById("admin-pass").value||"";
    if(code === ADMIN_CODE && pass === ADMIN_PASS){
      state.isAdmin = true; state.screen = "admin"; state.error = "";
    } else {
      state.error = "Código ou senha incorretos.";
    }
    render();
  }

  async function handleCreateUser(e){
    e.preventDefault();
    state.error = "";
    var username = (document.getElementById("new-username").value||"").trim();
    var cpfRaw = onlyDigits(document.getElementById("new-cpf").value||"");

    if(!username){ state.error = "Informe o nome de usuário."; render(); return; }
    if(cpfRaw.length !== 11){ state.error = "Informe um CPF válido com 11 dígitos."; render(); return; }
    if(findUser(username)){ state.error = "Já existe um usuário registrado com este nome."; render(); return; }

    var tempPass = genPassword();
    state.users.push({
      username: username, cpf: cpfRaw, password: tempPass,
      tempPassword: true, active: true, createdAt: new Date().toISOString()
    });

    var saved = await saveUsers();
    if(saved){
      state.lastCredential = { username: username, cpf: cpfRaw, password: tempPass };
      showToast("Usuário criado.");
      render();
    }
  }

  function handleCopyCred(){
    if(!state.lastCredential) return;
    var text = "Usuário: " + state.lastCredential.username +
               "\nCPF: " + formatCPF(state.lastCredential.cpf) +
               "\nSenha temporária: " + state.lastCredential.password;
    copyToClipboard(text, "Credenciais copiadas.");
  }

  function copyToClipboard(text, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ showToast(msg); }, function(){ fallbackCopy(text, msg); });
    } else {
      fallbackCopy(text, msg);
    }
  }

  function fallbackCopy(text, msg){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(msg); }
    catch(e){ showToast("Copie manualmente: " + text); }
    ta.remove();
  }

  async function handleChangePass(e){
    e.preventDefault();
    state.error = "";
    var p1 = document.getElementById("new-pass-1").value||"";
    var p2 = document.getElementById("new-pass-2").value||"";

    if(p1.length < 6){ state.error = "A nova senha deve ter no mínimo 6 caracteres."; render(); return; }
    if(p1 !== p2){ state.error = "As senhas não conferem."; render(); return; }

    var user = findUser(state.currentUser.username) || state.currentUser;
    user.password = p1;
    user.tempPassword = false;
    state.currentUser = user;

    var saved = await saveUsers();
    if(saved){
      showToast("Senha alterada.");
      state.activeTab = "inicio";
      state.screen = "painel";
      render();
    }
  }

  async function handleResetUserPass(username){
    var user = findUser(username);
    if(!user) return;
    var tempPass = genPassword();
    user.password = tempPass;
    user.tempPassword = true;
    var saved = await saveUsers();
    if(saved){
      state.lastCredential = { username: user.username, cpf: user.cpf, password: tempPass };
      showToast("Senha resetada.");
      render();
    }
  }

  async function handleToggleUserStatus(username){
    var user = findUser(username);
    if(!user) return;
    user.active = !user.active;
    var saved = await saveUsers();
    if(saved){
      showToast(user.active ? "Usuário ativado." : "Usuário inativado.");
      render();
    }
  }

  function handleLogout(){
    state.currentUser = null;
    state.isAdmin = false;
    state.screen = "login";
    state.activeTab = "inicio";
    state.error = "";
    state.lastCredential = null;
    state.photoData = {};
    render();
  }

  function wirePainel(){
    document.querySelectorAll(".nav-tab").forEach(function(tab){
      tab.addEventListener("click", function(){
        state.activeTab = tab.dataset.screen;
        applyTab();
      });
    });
    var sel = document.getElementById("edit-select");
    if(sel) sel.addEventListener("change", function(){ renderEditarForm(this.value); });
    applyTab();
  }

  function applyTab(){
    document.querySelectorAll(".nav-tab").forEach(function(t){
      t.classList.toggle("active", t.dataset.screen === state.activeTab);
    });
    document.querySelectorAll(".screen").forEach(function(s){
      s.classList.toggle("active", s.id === "screen-" + state.activeTab);
    });
    if(state.activeTab === "inicio") renderInicio();
    else if(state.activeTab === "adicionar") renderAdicionar();
    else if(state.activeTab === "editar"){ renderEditarSelect(); renderEditarForm(""); }
  }

  function renderInicio(){
    var container = document.getElementById("inicio-content");
    if(!container) return;

    var ativos = state.colaboradores.filter(function(c){ return c && c.ativo; });
    if(ativos.length === 0){
      container.innerHTML = '<div class="empty-state">Nenhum colaborador ativo cadastrado. Use a aba "Adicionar colaborador" para começar.</div>';
      return;
    }

    var porCelula = {};
    ativos.forEach(function(c){
      var cel = c.celula || "Sem célula";
      porCelula[cel] = porCelula[cel] || [];
      porCelula[cel].push(c);
    });

    var celulas = Object.keys(porCelula).sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });

    container.innerHTML = celulas.map(function(cel){
      var lista = porCelula[cel].slice().sort(function(a,b){
        return (a.nome||"").localeCompare(b.nome||"", "pt-BR");
      });
      return '<section class="celula-group">' +
        '<h2 class="celula-heading">' + escapeHTML(cel) + '<span class="count">' + lista.length + '</span></h2>' +
        '<div class="celula-rule"></div>' +
        '<div class="colab-grid">' + lista.map(colabCardHTML).join("") + '</div>' +
      '</section>';
    }).join("");

    container.querySelectorAll("[data-nota]").forEach(function(btn){
      btn.addEventListener("click", function(){ openNotaModal(btn.getAttribute("data-nota")); });
    });
    container.querySelectorAll("[data-email]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var c = findColab(btn.getAttribute("data-email"));
        if(!c) return;
        if(!c.email){ showToast("Este colaborador não tem e-mail cadastrado."); return; }
        copyToClipboard(c.email, "E-mail copiado: " + c.email);
      });
    });
  }

        '<div class="log-text">' + escapeHTML(n.texto || "") + '</div>' +

      '</li>';

  function openNotaModal(id){
    var colab = findColab(id);
    if(!colab) return;

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="card modal-card">' +
        '<div class="section-title" style="margin-bottom:2px;">Anotações</div>' +
        '<div class="section-sub">' + escapeHTML(colab.nome) + '</div>' +
        '<div id="modal-notas">' + notasListHTML(colab.notas) + '</div>' +
        '<div class="field" style="margin-top:14px;">' +
          '<label for="modal-nota-texto">Nova anotação</label>' +
          '<textarea id="modal-nota-texto" placeholder="Escreva a anotação"></textarea>' +
          '<div class="hint">Será registrada como ' + escapeHTML(autorAtual()) + ', com data e hora.</div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="modal-nota-salvar">Salvar anotação</button>' +
        '<button type="button" class="btn btn-secondary" id="modal-nota-fechar" style="margin-top:10px;">Fechar</button>' +
      '</div>';
    document.body.appendChild(overlay);

    var texto = overlay.querySelector("#modal-nota-texto");
    texto.focus();

    function fechar(){ overlay.remove(); }

    overlay.addEventListener("click", function(e){ if(e.target === overlay) fechar(); });
    overlay.querySelector("#modal-nota-fechar").addEventListener("click", fechar);

    overlay.querySelector("#modal-nota-salvar").addEventListener("click", async function(){
      var valor = texto.value.trim();
      if(!valor){ showToast("Escreva a anotação antes de salvar."); texto.focus(); return; }
      var alvo = findColab(id);
      if(!alvo){ showToast("Este colaborador não está mais na lista."); fechar(); return; }
      alvo.notas = alvo.notas || [];
      alvo.notas.push({ texto: valor, autor: autorAtual(), em: new Date().toISOString() });
      var ok = await saveColaboradores();
      if(!ok){ alvo.notas.pop(); return; }
      showToast("Anotação registrada.");
      fechar();
      renderInicio();
    });
  }

  function buildFormHTML(prefix, data){
    data = data || {};
    var superintendenciasOptions = Object.keys(REGIOES).map(function(s){
      return '<option value="' + escapeHTML(s) + '"' + (data.superintendencia === s ? " selected" : "") + '>' + escapeHTML(s) + '</option>';
    }).join("");
    var cargoOptions = CARGOS.map(function(c){
      return '<option value="' + escapeHTML(c) + '"' + (data.cargo === c ? " selected" : "") + '>' + escapeHTML(c) + '</option>';
    }).join("");
    var divisaoOptions = DIVISOES.map(function(d){
      return '<option value="' + escapeHTML(d) + '"' + (data.divisao === d ? " selected" : "") + '>' + escapeHTML(d) + '</option>';
    }).join("");
    var celulaOptions = CELULAS.map(function(c){
      return '<option value="' + escapeHTML(c) + '"' + (data.celula === c ? " selected" : "") + '>' + escapeHTML(c) + '</option>';
    }).join("");
    var centralOptions = CENTRAIS.map(function(c){
      return '<option value="' + escapeHTML(c) + '"' + (data.central === c ? " selected" : "") + '>' + escapeHTML(c) + '</option>';
    }).join("");

    var photoVal = state.photoData[prefix] || data.foto || null;
    var photoPreview = photoVal
      ? '<img class="photo-preview" id="' + prefix + '-photo-preview" src="' + photoVal + '" alt="">'
      : '<div class="photo-preview-placeholder" id="' + prefix + '-photo-preview">' + ICON_CAMERA + '</div>';

    var feriasRows = (data.ferias && data.ferias.length ? data.ferias : [{inicio:"", fim:""}]).map(function(f){
      return feriasRowHTML(f.inicio, f.fim);
    }).join("");

    return '' +
    '<div class="photo-upload">' +
      photoPreview +
      '<div>' +
        '<label for="' + prefix + '-foto" class="btn btn-secondary" style="display:inline-block; cursor:pointer;">Adicionar imagem</label>' +
        '<input type="file" id="' + prefix + '-foto" accept="image/*" style="display:none;">' +
        '<div class="hint">JPG ou PNG. A imagem é reduzida automaticamente antes de salvar.</div>' +
      '</div>' +
    '</div>' +

    '<div class="field"><label for="' + prefix + '-nome">Nome completo</label><input type="text" id="' + prefix + '-nome" value="' + escapeHTML(data.nome||"") + '" placeholder="Nome completo do colaborador"></div>' +

    '<div class="grid-2">' +
      '<div class="field"><label for="' + prefix + '-cargo">Cargo</label><select id="' + prefix + '-cargo"><option value="">Selecione…</option>' + cargoOptions + '</select></div>' +
      '<div class="field"><label for="' + prefix + '-superior">Superior imediato</label><input type="text" id="' + prefix + '-superior" value="' + escapeHTML(data.superiorImediato||"") + '" readonly placeholder="Preenchido conforme o cargo"></div>' +
    '</div>' +

    '<div class="grid-3">' +
      '<div class="field"><label for="' + prefix + '-regime">Regime de trabalho</label><select id="' + prefix + '-regime"><option value="">Selecione…</option><option value="Presencial"' + (data.regime==="Presencial"?" selected":"") + '>Presencial</option><option value="Teletrabalho"' + (data.regime==="Teletrabalho"?" selected":"") + '>Teletrabalho</option></select></div>' +
      '<div class="field"><label for="' + prefix + '-sabados">Trabalha aos sábados?</label><select id="' + prefix + '-sabados"><option value="">Selecione…</option><option value="Sim"' + (data.trabalhaSabados==="Sim"?" selected":"") + '>Sim</option><option value="Não"' + (data.trabalhaSabados==="Não"?" selected":"") + '>Não</option></select></div>' +
      '<div class="field"><label for="' + prefix + '-matricula">Número de matrícula</label><input type="text" id="' + prefix + '-matricula" value="' + escapeHTML(data.matricula||"") + '" placeholder="Ex: 000000"></div>' +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="field"><label for="' + prefix + '-horaInicio">Início do expediente</label><input type="time" id="' + prefix + '-horaInicio" value="' + escapeHTML(data.horarioInicio||"") + '"></div>' +
      '<div class="field"><label for="' + prefix + '-horaFim">Fim do expediente</label><input type="time" id="' + prefix + '-horaFim" value="' + escapeHTML(data.horarioFim||"") + '"></div>' +
    '</div>' +

    '<div class="divider-note">Documentação</div>' +
    '<div class="grid-3">' +
      '<div class="field"><label for="' + prefix + '-cpf">CPF</label><input type="text" id="' + prefix + '-cpf" value="' + escapeHTML(formatCPF(data.cpf||"")) + '" placeholder="000.000.000-00" inputmode="numeric" maxlength="14"></div>' +
      '<div class="field"><label for="' + prefix + '-rg">RG</label><input type="text" id="' + prefix + '-rg" value="' + escapeHTML(data.rg||"") + '" placeholder="Número do RG"></div>' +
      '<div class="field"><label for="' + prefix + '-nascimento">Data de nascimento</label><input type="date" id="' + prefix + '-nascimento" value="' + escapeHTML(data.dataNascimento||"") + '"></div>' +
    '</div>' +
    '<div class="field"><label for="' + prefix + '-mae">Nome completo da mãe</label><input type="text" id="' + prefix + '-mae" value="' + escapeHTML(data.nomeMae||"") + '" placeholder="Nome completo da mãe"></div>' +

    '<div class="divider-note">Contato</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label for="' + prefix + '-telefone">Telefone / celular (com DDD)</label><input type="text" id="' + prefix + '-telefone" value="' + escapeHTML(formatTelefone(data.telefone||"")) + '" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15"></div>' +
      '<div class="field"><label for="' + prefix + '-email">E-mail</label><input type="email" id="' + prefix + '-email" value="' + escapeHTML(data.email||"") + '" placeholder="nome@detran.sp.gov.br"></div>' +
    '</div>' +

    '<div class="divider-note">Lotação</div>' +
    '<div class="grid-3">' +
      '<div class="field"><label for="' + prefix + '-superintendencia">Superintendência</label><select id="' + prefix + '-superintendencia"><option value="">Selecione…</option>' + superintendenciasOptions + '</select></div>' +
      '<div class="field"><label for="' + prefix + '-localidade">Localidade</label><select id="' + prefix + '-localidade"><option value="">Selecione a superintendência primeiro</option></select></div>' +
      '<div class="field"><label for="' + prefix + '-ra">Região administrativa</label><input type="text" id="' + prefix + '-ra" value="' + escapeHTML(data.regiaoAdministrativa||"") + '" readonly placeholder="Preenchida automaticamente"></div>' +
    '</div>' +
    '<div class="grid-3">' +
      '<div class="field"><label for="' + prefix + '-central">Central</label><select id="' + prefix + '-central"><option value="">Selecione…</option>' + centralOptions + '</select></div>' +
      '<div class="field"><label for="' + prefix + '-divisao">Divisão</label><select id="' + prefix + '-divisao"><option value="">Selecione…</option>' + divisaoOptions + '</select></div>' +
      '<div class="field"><label for="' + prefix + '-celula">Célula</label><select id="' + prefix + '-celula"><option value="">Selecione…</option>' + celulaOptions + '</select></div>' +
    '</div>' +
    '<div class="field"><label for="' + prefix + '-lider">Líder de célula</label><select id="' + prefix + '-lider"><option value="">Selecione a célula primeiro</option></select>' +
      '<div class="hint">Lista colaboradores ativos da célula selecionada cujo cargo contenha "Líder" ou "Coordenador".</div></div>' +

    '<div class="divider-note">Atividades no SAC</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label for="' + prefix + '-inicioSac">Início das atividades no SAC</label><input type="date" id="' + prefix + '-inicioSac" value="' + escapeHTML(data.inicioAtividadesSac||"") + '">' +
        '<div class="hint">Ativações e inativações posteriores ficam registradas no histórico.</div></div>' +
      '<div class="field"><label>Histórico</label>' + historicoListHTML(data.historico) + '</div>' +
    '</div>' +

    '<div class="divider-note">Férias</div>' +
    '<div id="' + prefix + '-ferias-list">' + feriasRows + '</div>' +
    '<button type="button" class="inline-btn" id="' + prefix + '-add-ferias">Adicionar período de férias</button>' +

    '<div class="divider-note">Notas</div>' +
    '<div id="' + prefix + '-notas-list">' + notasListHTML(data.notas) + '</div>' +
    '<div class="field" style="margin-top:12px;">' +
      '<label for="' + prefix + '-nota">Nova nota</label>' +
      '<textarea id="' + prefix + '-nota" placeholder="Escreva uma nota sobre o colaborador"></textarea>' +
      '<div class="hint">Ao salvar, a nota é registrada como ' + escapeHTML(autorAtual()) + ', com data e hora.</div>' +
    '</div>';
  }

  function feriasRowHTML(inicio, fim){
    return '<div class="ferias-row">' +
      '<div class="field" style="margin-bottom:0;"><label>Início</label><input type="date" class="ferias-inicio" value="' + escapeHTML(inicio||"") + '"></div>' +
      '<div class="field" style="margin-bottom:0;"><label>Fim</label><input type="date" class="ferias-fim" value="' + escapeHTML(fim||"") + '"></div>' +
      '<button type="button" class="remove-ferias">Remover</button>' +
    '</div>';
  }

  function wireForm(prefix, existingId){
    var $ = function(id){ return document.getElementById(prefix + "-" + id); };

    $("foto").addEventListener("change", function(e){
      var file = e.target.files[0];
      if(!file) return;
      resizeImage(file, 320, function(dataUrl){
        state.photoData[prefix] = dataUrl;
        var preview = document.getElementById(prefix + "-photo-preview");
        var img = document.createElement("img");
        img.className = "photo-preview";
        img.id = prefix + "-photo-preview";
        img.src = dataUrl;
        img.alt = "";
        preview.replaceWith(img);
      });
    });

    $("cpf").addEventListener("input", function(){ $("cpf").value = formatCPF($("cpf").value); });
    $("telefone").addEventListener("input", function(){ $("telefone").value = formatTelefone($("telefone").value); });

    $("cargo").addEventListener("change", function(){
      $("superior").value = SUPERIOR_IMEDIATO[$("cargo").value] || "";
    });

    $("superintendencia").addEventListener("change", function(){
      populateLocalidades(prefix, $("superintendencia").value, "");
      $("ra").value = "";
    });

    $("localidade").addEventListener("change", function(){
      var lista = REGIOES[$("superintendencia").value] || [];
      var loc = $("localidade").value;
      var found = lista.find(function(item){ return item.localidade === loc; });
      $("ra").value = found ? found.ra : "";
    });

    $("celula").addEventListener("change", function(){
      populateLideres(prefix, $("celula").value, existingId);
    });

    $("add-ferias").addEventListener("click", function(){
      var list = document.getElementById(prefix + "-ferias-list");
      var div = document.createElement("div");
      div.innerHTML = feriasRowHTML("", "");
      list.appendChild(div.firstChild);
      wireFeriasRemove(prefix);
    });
    wireFeriasRemove(prefix);

    var sup = $("superintendencia").value;
    if(sup) populateLocalidades(prefix, sup, pendingLocalidade[prefix] || "");
    var cel = $("celula").value;
    if(cel) populateLideres(prefix, cel, existingId);
  }

  function populateLocalidades(prefix, superintendencia, selectedLocalidade){
    var select = document.getElementById(prefix + "-localidade");
    var lista = REGIOES[superintendencia] || [];
    if(lista.length === 0){
      select.innerHTML = '<option value="">Selecione a superintendência primeiro</option>';
      return;
    }
    select.innerHTML = '<option value="">Selecione…</option>' + lista.map(function(item){
      return '<option value="' + escapeHTML(item.localidade) + '"' + (item.localidade === selectedLocalidade ? " selected" : "") + '>' +
        escapeHTML(item.localidade) + ' — ' + escapeHTML(item.ra) + '</option>';
    }).join("");
  }

  function populateLideres(prefix, celula, currentId){
    var select = document.getElementById(prefix + "-lider");
    var currentVal = select.value;
    var candidatos = state.colaboradores.filter(function(c){
      return c && c.ativo && c.celula === celula && /líder|lider|coordenador/i.test(c.cargo || "") && c.id !== currentId;
    });
    if(candidatos.length === 0){
      select.innerHTML = '<option value="">Nenhum líder cadastrado para esta célula</option>';
      return;
    }
    select.innerHTML = '<option value="">Selecione…</option>' + candidatos.map(function(c){
      return '<option value="' + c.id + '"' + (c.id === currentVal ? " selected" : "") + '>' +
        escapeHTML(c.nome) + ' (' + escapeHTML(c.cargo) + ')</option>';
    }).join("");
  }

  function wireFeriasRemove(prefix){
    var list = document.getElementById(prefix + "-ferias-list");
    Array.prototype.forEach.call(list.querySelectorAll(".remove-ferias"), function(btn){
      btn.onclick = function(){
        if(list.children.length > 1){ btn.closest(".ferias-row").remove(); }
        else {
          btn.closest(".ferias-row").querySelector(".ferias-inicio").value = "";
          btn.closest(".ferias-row").querySelector(".ferias-fim").value = "";
        }
      };
    });
  }

  function collectFormData(prefix){
    var $ = function(id){ return document.getElementById(prefix + "-" + id); };
    var ferias = [];
    document.querySelectorAll("#" + prefix + "-ferias-list .ferias-row").forEach(function(row){
      var ini = row.querySelector(".ferias-inicio").value;
      var fim = row.querySelector(".ferias-fim").value;
      if(ini || fim) ferias.push({inicio: ini, fim: fim});
    });
    return {
      nome: $("nome").value.trim(),
      cargo: $("cargo").value,
      superiorImediato: $("superior").value,
      regime: $("regime").value,
      trabalhaSabados: $("sabados").value,
      matricula: $("matricula").value.trim(),
      horarioInicio: $("horaInicio").value,
      horarioFim: $("horaFim").value,
      cpf: onlyDigits($("cpf").value),
      rg: $("rg").value.trim(),
      dataNascimento: $("nascimento").value,
      nomeMae: $("mae").value.trim(),
      telefone: onlyDigits($("telefone").value),
      email: $("email").value.trim(),
      superintendencia: $("superintendencia").value,
      localidade: $("localidade").value,
      regiaoAdministrativa: $("ra").value,
      central: $("central").value,
      divisao: $("divisao").value,
      celula: $("celula").value,
      liderCelulaId: $("lider").value,
      inicioAtividadesSac: $("inicioSac").value,
      ferias: ferias,
      foto: state.photoData[prefix] || null
    };
  }

  function novaNotaDoForm(prefix){
    var campo = document.getElementById(prefix + "-nota");
    if(!campo) return null;
    var valor = campo.value.trim();
    if(!valor) return null;
    return { texto: valor, autor: autorAtual(), em: new Date().toISOString() };
  }

  function validate(data){
    if(!data.nome) return "Informe o nome completo.";
    if(!data.cargo) return "Selecione o cargo.";
    if(onlyDigits(data.cpf).length !== 11) return "Informe um CPF válido.";
    if(!data.superintendencia || !data.localidade) return "Selecione superintendência e localidade.";
    return null;
  }

  function renderAdicionar(){
    state.photoData["add"] = null;
    pendingLocalidade["add"] = "";
    var form = document.getElementById("add-form");
    if(!form) return;

    form.innerHTML = buildFormHTML("add", {}) +
      '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar colaborador</button></div>';
    document.getElementById("add-feedback").innerHTML = "";
    wireForm("add", null);

    form.onsubmit = async function(e){
      e.preventDefault();
      var feedback = document.getElementById("add-feedback");
      var data = collectFormData("add");
      var erro = validate(data);
      if(erro){ feedback.innerHTML = '<div class="error-box">' + escapeHTML(erro) + '</div>'; return; }

      var agora = new Date().toISOString();
      data.id = genId();
      data.ativo = true;
      data.createdAt = Date.now();
      data.notas = [];
      data.historico = [{
        evento: "Cadastro criado",
        em: agora,
        por: autorAtual(),
        detalhe: data.inicioAtividadesSac ? "Início das atividades no SAC: " + formatData(data.inicioAtividadesSac) : ""
      }];

      var nota = novaNotaDoForm("add");
      if(nota) data.notas.push(nota);

      state.colaboradores.push(data);
      var ok = await saveColaboradores();
      if(!ok){
        state.colaboradores.pop();
        feedback.innerHTML = '<div class="error-box">O cadastro não foi salvo. Tente novamente.</div>';
        return;
      }
      showToast("Colaborador salvo.");
      renderAdicionar();
      document.getElementById("add-feedback").innerHTML = '<div class="success-box">Colaborador cadastrado.</div>';
    };
  }

  function renderEditarSelect(){
    var select = document.getElementById("edit-select");
    if(!select) return;
    var currentVal = select.value;
    select.innerHTML = '<option value="">Selecione um colaborador…</option>' + state.colaboradores.map(function(c){
      return '<option value="' + c.id + '"' + (c.id === currentVal ? " selected" : "") + '>' +
        escapeHTML(c.nome) + (c.ativo ? "" : " (inativo)") + '</option>';
    }).join("");
  }

  function renderEditarForm(id){
    var wrap = document.getElementById("edit-form-wrap");
    var feedback = document.getElementById("edit-feedback");
    if(!wrap) return;
    feedback.innerHTML = "";
    if(!id){ wrap.innerHTML = ""; return; }

    var colab = findColab(id);
    if(!colab){ wrap.innerHTML = ""; return; }

    state.photoData["edit"] = colab.foto || null;
    pendingLocalidade["edit"] = colab.localidade || "";

    var statusBadge = colab.ativo
      ? '<span class="badge badge-active">Ativo</span>'
      : '<span class="badge badge-inactive">Inativo</span>';

    var form = document.createElement("form");
    form.id = "edit-form";
    form.innerHTML = '<div style="margin-bottom:14px;">' + statusBadge + '</div>' +
      buildFormHTML("edit", colab) +
      '<div class="form-actions">' +
        '<button type="submit" class="btn btn-primary">Salvar alterações</button>' +
        '<button type="button" class="' + (colab.ativo ? "inline-btn-danger" : "inline-btn") + '" id="edit-toggle-status">' +
          (colab.ativo ? "Inativar colaborador" : "Ativar colaborador") + '</button>' +
      '</div>';
    wrap.innerHTML = "";
    wrap.appendChild(form);

    wireForm("edit", colab.id);
    populateLocalidades("edit", colab.superintendencia, colab.localidade);
    document.getElementById("edit-ra").value = colab.regiaoAdministrativa || "";
    if(colab.celula) populateLideres("edit", colab.celula, colab.id);
    if(colab.liderCelulaId){
      var liderSel = document.getElementById("edit-lider");
      if(liderSel) liderSel.value = colab.liderCelulaId;
    }

    form.onsubmit = async function(e){
      e.preventDefault();
      var data = collectFormData("edit");
      var erro = validate(data);
      if(erro){ feedback.innerHTML = '<div class="error-box">' + escapeHTML(erro) + '</div>'; return; }

      var alvo = findColab(colab.id);
      if(!alvo){ feedback.innerHTML = '<div class="error-box">Este colaborador não está mais na lista.</div>'; return; }

      var inicioAnterior = alvo.inicioAtividadesSac || "";
      Object.assign(alvo, data);
      alvo.notas = alvo.notas || [];
      alvo.historico = alvo.historico || [];

      if(data.inicioAtividadesSac !== inicioAnterior){
        alvo.historico.push({
          evento: "Início das atividades no SAC atualizado",
          em: new Date().toISOString(),
          por: autorAtual(),
          detalhe: (inicioAnterior ? formatData(inicioAnterior) : "não informado") + " → " + (data.inicioAtividadesSac ? formatData(data.inicioAtividadesSac) : "não informado")
        });
      }

      var nota = novaNotaDoForm("edit");
      if(nota) alvo.notas.push(nota);

      var ok = await saveColaboradores();
      if(!ok){ feedback.innerHTML = '<div class="error-box">As alterações não foram salvas. Tente novamente.</div>'; return; }

      showToast("Colaborador atualizado.");
      renderEditarSelect();
      document.getElementById("edit-select").value = alvo.id;
      renderEditarForm(alvo.id);
      document.getElementById("edit-feedback").innerHTML = '<div class="success-box">Alterações salvas.</div>';
    };

    document.getElementById("edit-toggle-status").addEventListener("click", async function(){
      var alvo = findColab(colab.id);
      if(!alvo) return;
      alvo.ativo = !alvo.ativo;
      alvo.historico = alvo.historico || [];
      alvo.historico.push({
        evento: alvo.ativo ? "Colaborador ativado" : "Colaborador inativado",
        em: new Date().toISOString(),
        por: autorAtual(),
        detalhe: ""
      });
      var ok = await saveColaboradores();
      if(!ok){
        alvo.ativo = !alvo.ativo;
        alvo.historico.pop();
        showToast("Não foi possível alterar o status.");
        return;
      }
      showToast(alvo.nome + (alvo.ativo ? " ativado." : " inativado."));
      renderEditarSelect();
      document.getElementById("edit-select").value = alvo.id;
      renderEditarForm(alvo.id);
    });
  }

  syncUsers();
  syncColaboradores();

})();
</script>
</body>
</html>
