<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC DETRAN — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#23272D;
    --bg-card:#2F353D;
    --line:#454E58;
    --teal-deep:#0F4C5C;
    --teal:#1B6B7A;
    --mint:#8BC4B9;
    --amber:#F2C14E;
    --amber-hi:#F7D77A;
    --cream:#FFF4D6;
    --offwhite:#F2F7F6;
    --slate:#8C97A1;
    --bluegray:#9AA5B1;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--font-body); color:var(--offwhite);
    background:
      radial-gradient(1100px 700px at 82% 8%, rgba(27,107,122,0.45), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(15,76,92,0.5), transparent 55%),
      var(--bg-primary);
    min-height:100vh;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; border-bottom:1px solid var(--line); background:rgba(47,53,61,0.7);
    backdrop-filter:blur(6px); position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:30px; height:30px; flex-shrink:0;}
  .brand-title{font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--cream); line-height:1;}
  .brand-sub{font-family:var(--font-mono); font-size:8.5px; letter-spacing:2px; text-transform:uppercase; color:var(--mint); margin-top:3px;}
  .logout-x{
    background:none; border:1px solid var(--line); color:var(--bluegray); border-radius:7px;
    padding:8px 14px; font-family:var(--font-body); font-size:12.5px; cursor:pointer;
  }
  .logout-x:hover{border-color:var(--amber); color:var(--amber-hi);}

  .nav-tabs{
    display:flex; gap:8px; padding:14px 22px; max-width:920px; margin:0 auto;
    flex-wrap:wrap;
  }
  .nav-tab{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--offwhite);
    font-family:var(--font-body); font-size:13.5px; font-weight:500; cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .nav-tab svg{width:17px; height:17px; flex-shrink:0;}
  .nav-tab:hover{border-color:var(--mint); color:var(--mint);}
  .nav-tab.active{
    background:rgba(242,193,78,0.14); border-color:var(--amber); color:var(--amber-hi);
  }

  .content-wrap{max-width:920px; margin:0 auto; padding:6px 22px 60px;}
  .screen{display:none;}
  .screen.active{display:block;}

  .maintenance-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:50px 30px; text-align:center; margin-top:14px;
  }
  .maint-icon{width:56px; height:56px; margin:0 auto 18px; display:block;}
  .maint-title{font-family:var(--font-display); font-weight:700; font-size:21px; color:var(--cream); margin:0 0 8px;}
  .maint-text{color:var(--bluegray); font-size:13.5px; line-height:1.6; margin:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 12 H50 C68 12 80 26 80 50 C80 74 68 88 50 88 H20 V64 H48 C56 64 60 58 60 50 C60 42 56 36 48 36 H20 Z" fill="none" stroke="var(--amber)" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="34" cy="60" r="9" fill="none" stroke="var(--amber)" stroke-width="6"/>
      <circle cx="60" cy="60" r="9" fill="none" stroke="var(--amber)" stroke-width="6"/>
      <path d="M34 60 L48 42 L58 42 L50 52 L60 60" fill="none" stroke="var(--amber)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M46 40 Q50 32 58 34" fill="none" stroke="var(--amber)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-title">SAC DETRAN</div>
      <div class="brand-sub">Painel do usuário</div>
    </div>
  </div>
  <button class="logout-x" id="logout-btn">Sair</button>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" data-screen="inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    Início
  </button>
  <button class="nav-tab" data-screen="adicionar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
    Adicionar colaborador
  </button>
  <button class="nav-tab" data-screen="editar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Editar colaborador
  </button>
</div>

<div class="content-wrap">

  <!-- ===================== INÍCIO ===================== -->
  <section class="screen active" id="screen-inicio">
    <!-- adicionar html aqui -->

    <div class="maintenance-card">
      <svg class="maint-icon" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.77z"/></svg>
      <div class="maint-title">Em manutenção</div>
      <p class="maint-text">Esta página está sendo preparada e estará disponível em breve.</p>
    </div>

    <!-- adicionar html aqui -->
  </section>

  <!-- ================ ADICIONAR COLABORADOR ================ -->
  <section class="screen" id="screen-adicionar">
    <!-- adicionar html aqui -->

    <div class="maintenance-card">
      <svg class="maint-icon" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.77z"/></svg>
      <div class="maint-title">Em manutenção</div>
      <p class="maint-text">Esta página está sendo preparada e estará disponível em breve.</p>
    </div>

    <!-- adicionar html aqui -->
  </section>

  <!-- ================== EDITAR COLABORADOR ================== -->
  <section class="screen" id="screen-editar">
    <!-- adicionar html aqui -->

    <div class="maintenance-card">
      <svg class="maint-icon" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.77z"/></svg>
      <div class="maint-title">Em manutenção</div>
      <p class="maint-text">Esta página está sendo preparada e estará disponível em breve.</p>
    </div>

    <!-- adicionar html aqui -->
  </section>

</div>

<script>
  // Alternar abas ativas e exibe a tela correta (Início / Adicionar / Editar)
  document.querySelectorAll(".nav-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".nav-tab").forEach(function(t){ t.classList.remove("active"); });
      document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
      
      tab.classList.add("active");
      const targetScreen = document.getElementById("screen-" + tab.dataset.screen);
      if (targetScreen) {
        targetScreen.classList.add("active");
      }
    });
  });

  // Ação para o botão "Sair" após o login
  document.getElementById("logout-btn").addEventListener("click", function(){
    if (confirm("Deseja realmente sair da sessão?")) {
      // Redireciona de volta para a tela de login
      window.location.href = "login.html";
    }
  });
</script>

</body>
</html>
